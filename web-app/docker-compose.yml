# Запуск:  cd web-app && docker compose up --build      → http://127.0.0.1:8000
# Другой порт:  PORT=8080 docker compose up --build
name: rehab

services:
  web:
    build:
      context: ..                    # корень репозитория: нужны web-app/ и knowledge-base/
      dockerfile: web-app/Dockerfile
    image: rehab-web-app:latest
    container_name: rehab-web-app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      REHAB_KB_DIR: /srv/knowledge-base
      REHAB_DATA_DIR: /var/data
    volumes:
      # база знаний подключается только на чтение: правка .rq/.owl → docker compose restart,
      # пересобирать образ не нужно. Выводы правил живут в памяти, .owl не изменяется.
      - ../knowledge-base:/srv/knowledge-base:ro
      # свои пациенты и программы переживают перезапуск; сбросить — docker compose down -v
      - rehab-data:/var/data
    restart: unless-stopped

volumes:
  rehab-data:
