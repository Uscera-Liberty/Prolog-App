<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Подбор реабилитационной программы{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">🩺 <span>Реабилитация</span></a>
        <nav class="nav">
            <a href="/" class="{{ 'active' if active == 'index' }}">Главная</a>
            <a href="/patients" class="{{ 'active' if active == 'patients' }}">Пациенты</a>
            <a href="/recommend" class="{{ 'active' if active == 'recommend' }}">Рекомендации</a>
            <a href="/catalog" class="{{ 'active' if active == 'catalog' }}">Каталог</a>
        </nav>
    </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer muted">
    Онтология OWL · SWRL-правила · рекомендательные SPARQL-запросы · вариант 22 · данные только для демонстрации
</footer>
<script src="{{ url_for('static', path='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
